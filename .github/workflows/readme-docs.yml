name: README documentation qualification
on:
  pull_request:
    paths:
      - "README.md"
      - ".github/workflows/readme-docs.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readme-and-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Check required README references and provenance language
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("README.md").read_text()
          assert "https://github.com/cogno-us/cognous-open-control-stack/blob/main/component-lock.json" in text
          assert "https://github.com/cogno-us/cognous-stack-qualification/blob/main/results/readme-commentary/index.md" in text
          assert "non-authorizing" in text.lower() or "does not establish" in text.lower()
          assert "component-lock.json" in text
          print("README status and authority boundary assertions passed")
          PY
      - name: Preserve source-owned custody regression
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q tests/test_authority_digest_custody_profile.py
