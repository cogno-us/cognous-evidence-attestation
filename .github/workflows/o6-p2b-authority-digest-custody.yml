name: O6 P2B authority digest custody

on:
  pull_request:
    paths:
      - "profiles/authority_digest_custody.py"
      - "tests/test_authority_digest_custody_profile.py"
      - "tests/fixtures/authority-digest-custody-v1.json"
      - "docs/AUTHORITY_DIGEST_CUSTODY_PROFILE_V1.md"
      - "docs/authority-digest-custody-v1.schema.json"
      - ".github/workflows/o6-p2b-authority-digest-custody.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests/test_authority_digest_custody_profile.py
